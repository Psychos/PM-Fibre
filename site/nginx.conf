server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
    }

    # Manifeste des donnees (roadmap 3.2/3.4) : l'app le relit au lancement avec
    # If-None-Match. Il doit etre revalide a chaque fois, sinon le cache
    # Cloudflare devant mapm.online masquerait les mises a jour ARCEP.
    # "no-cache" n'interdit pas le stockage, il impose la revalidation : l'ETag
    # que nginx pose sur les fichiers statiques suffit alors a repondre 304.
    location = /data/manifest.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    # Paquets par departement : le nom porte le departement, pas la version, mais
    # l'app verifie le sha256 du manifeste avant de les installer. Cache court
    # cote intermediaires pour qu'un nouveau trimestre ARCEP se propage vite.
    location ^~ /data/deps/ {
        default_type application/gzip;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
